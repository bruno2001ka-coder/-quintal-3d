name: Deploy Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fly-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy quintal-3d to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stabilize CesiumMan character integration
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          old = "modelo.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=true}});"
          new = "modelo.traverse(o=>{if(o.isMesh){o.visible=true;o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false}});"
          if old in s:
              s = s.replace(old, new, 1)

          old = "bossVisualPivot.visible=true;\n  bossVisualPivot.add(modelo);\n  bossMixer=new THREE.AnimationMixer(modelo);"
          new = "bossVisualPivot.visible=true;\n  bossVisualPivot.add(modelo);\n  bossVisualPivot.updateMatrixWorld(true);\n  modelo.updateMatrixWorld(true);\n  bossMixer=new THREE.AnimationMixer(modelo);"
          if old in s:
              s = s.replace(old, new, 1)

          old = "  if(bossModeloPronto)for(const antigo of [...player.children])if(antigo!==bossVisualPivot)antigo.visible=false;"
          new = "  if(bossModeloPronto){\n   requestAnimationFrame(()=>{\n    if(bossModelo===modelo&&bossVisualPivot.visible&&modelo.visible){\n     for(const antigo of [...player.children])if(antigo!==bossVisualPivot)antigo.visible=false;\n    }\n   });\n  }"
          if old in s:
              s = s.replace(old, new, 1)

          old = "modelo.visible=true; bossVisualPivot.visible=true;\n  window.__quintalBoss.meshes=bossMeshCount;"
          new = "modelo.visible=true; bossVisualPivot.visible=true;\n  modelo.matrixAutoUpdate=true;\n  bossVisualPivot.matrixAutoUpdate=true;\n  window.__quintalBoss.meshes=bossMeshCount;"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          if s == original:
              print('CesiumMan já estava estabilizado; nenhum patch necessário.')
          else:
              print('Patch do CesiumMan aplicado.')

      - name: Commit character fix back to main
        shell: bash
        run: |
          if git diff --quiet -- public/index.html; then
            echo "Nenhuma alteração do personagem para commitar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "fix: stabilize CesiumMan character integration"
          git push origin HEAD:main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate server syntax
        run: node --check servidor-1.js

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --app quintal-3d --remote-only --wait-timeout 300

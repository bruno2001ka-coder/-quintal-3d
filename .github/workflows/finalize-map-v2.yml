name: Finalize map v2

on:
  push:
    branches:
      - rebuild/map-v2-2026-08-29

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fix remaining map integration details
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          old='''  const off=[\n   [-7,-4],[-4.6,-4],[-2.2,-4],[-7,-1.4],[-4.6,-1.4],[-2.2,-1.4],   // 0-5 sol\n   [3.2,-4.4],[5.2,-4.4],[3.2,-2.4],[5.2,-2.4],                     // 6-9 estufa\n   [-6.6,3.4],[-4.6,3.4],[-2.6,3.4],[-6.6,5.4],[-4.6,5.4],[-2.6,5.4] // 10-15 grow\n  ];'''
          new='''  const off=[\n   [-2.4,-1.7],[-0.8,-1.7],[0.8,-1.7],[2.4,-1.7],\n   [-2.4,-0.4],[-0.8,-0.4],[0.8,-0.4],[2.4,-0.4],\n   [-2.4,0.9],[-0.8,0.9],[0.8,0.9],[2.4,0.9],\n   [-2.4,2.2],[-0.8,2.2],[0.8,2.2],[2.4,2.2]\n  ];'''
          if old not in s:
              raise SystemExit('client plot offsets baseline not found')
          s=s.replace(old,new,1)

          s=s.replace('function montarLote(lote){\n  const W=LOTE_W,D=LOTE_D,alt=2.45;', 'function montarLote(lote){\n  if(lote.montado)return;\n  const W=LOTE_W,D=LOTE_D,alt=2.45;',1)
          s=s.replace('  lote.portaoPos={x:lote.x,z:lote.z+D/2};\n  lote.group=g;\n  return g;\n}', '  lote.portaoPos={x:lote.x,z:lote.z+D/2};\n  lote.group=g;\n  lote.montado=true;\n  return g;\n}',1)
          p.write_text(s,encoding='utf-8')

          p=Path('servidor-1.js')
          s=p.read_text(encoding='utf-8')
          if 'const LOTE_W = 8, LOTE_D = 7;' not in s:
              raise SystemExit('server compact lot dimensions missing')
          if 'const LOTE_SPOTS = [[-44,27],[-34,27],[-24,27],[-14,27],[-4,27],[6,27],[16,27],[26,27],[36,27],[46,27]];' not in s:
              raise SystemExit('server compact lot spots missing')
          if 'lote.z + LOTE_D / 2 + 1.25' not in s:
              raise SystemExit('safe spawn missing')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check servidor-1.js
          python3 - <<'PY'
          from pathlib import Path
          c=Path('public/index.html').read_text(encoding='utf-8')
          s=Path('servidor-1.js').read_text(encoding='utf-8')
          assert 'const LOTE_W=8, LOTE_D=7;' in c
          assert 'lote.montado=true;' in c
          assert '[-2.4,-1.7]' in c
          assert 'const LOTE_W = 8, LOTE_D = 7;' in s
          assert 'lote.z + LOTE_D / 2 + 1.25' in s
          print('MAP_V2_FINAL_OK')
          PY
          git diff --check

      - name: Commit final map v2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html servidor-1.js
          if git diff --cached --quiet; then
            echo 'No final changes'
            exit 0
          fi
          git commit -m 'fix: finalize compact map geometry and streaming'
          git push origin HEAD:rebuild/map-v2-2026-08-29

name: Rebuild map v2

on:
  push:
    branches:
      - rebuild/map-v2-2026-08-29
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply map v2
        run: python3 scripts/rebuild-map-v2.py

      - name: Validate JavaScript
        run: node --check servidor-1.js

      - name: Validate map contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c=Path('public/index.html').read_text(encoding='utf-8')
          s=Path('servidor-1.js').read_text(encoding='utf-8')
          for text in ['const LOTE_W=8, LOTE_D=7;', 'const LOTE_SPOTS=[[-44,27],[-34,27],[-24,27],[-14,27],[-4,27],[6,27],[16,27],[26,27],[36,27],[46,27]];']:
              assert text in c, text
          for text in ['const LOTE_W = 8, LOTE_D = 7;', 'const LOTE_SPOTS = [[-44,27],[-34,27],[-24,27],[-14,27],[-4,27],[6,27],[16,27],[26,27],[36,27],[46,27]];', 'lote.z + LOTE_D / 2 + 1.25']:
              assert text in s, text
          print('MAP_V2_OK')
          PY
          git diff --check

      - name: Commit generated map v2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html servidor-1.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'feat: rebuild compact residential map'
          git push origin HEAD:rebuild/map-v2-2026-08-29

name: Security and regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check servidor-1.js

      - name: Check client syntax
        run: |
          node check-client-syntax.js
          node --check /tmp/quintal-client-inline.js

      - name: Run WebSocket security integration test
        env:
          PORT: 8800
          AUTH_SECRET: ci-only-session-secret
          DB_PATH: ${{ runner.temp }}/quintal-ci.db
        run: |
          set -euo pipefail
          node servidor-1.js > "$RUNNER_TEMP/quintal-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          TEST_WS=ws://127.0.0.1:8800 node test-seguranca.js
          cat "$RUNNER_TEMP/quintal-server.log"

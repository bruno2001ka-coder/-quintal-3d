name: Security and regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check servidor-1.js
          node --check test-seguranca.js
          node --check test-multiplayer-aoi.js
          node --check test-carga.js
          node --check test-reconexao-posicao.js
          node check-client-syntax.js
          node --check /tmp/quintal-client-inline.js

      - name: Run isolated regression servers and tests
        env:
          AUTH_SECRET: ci-only-session-secret
        run: |
          set -euo pipefail
          pids=()
          cleanup() { for pid in "${pids[@]}"; do kill "$pid" 2>/dev/null || true; done; }
          trap cleanup EXIT
          for port in 8800 8801 8802 8803; do
            rm -f "$RUNNER_TEMP/quintal-$port.db" "$RUNNER_TEMP/quintal-$port.db-shm" "$RUNNER_TEMP/quintal-$port.db-wal"
            PORT="$port" DB_PATH="$RUNNER_TEMP/quintal-$port.db" node servidor-1.js > "$RUNNER_TEMP/quintal-$port.log" 2>&1 &
            pids+=("$!")
          done
          sleep 2
          TEST_WS=ws://127.0.0.1:8800 npm test
          TEST_WS=ws://127.0.0.1:8801 npm run test:aoi
          TEST_WS=ws://127.0.0.1:8802 TEST_HTTP=http://127.0.0.1:8802 npm run test:carga
          TEST_WS=ws://127.0.0.1:8803 npm run test:reconexao
          for port in 8800 8801 8802 8803; do cat "$RUNNER_TEMP/quintal-$port.log"; done

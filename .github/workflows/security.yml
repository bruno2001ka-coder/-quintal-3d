name: Security and regression tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check syntax
        run: |
          node --check servidor-1.js
          node --check testes/test-seguranca.js
          node --check testes/test-regressao-p0.js
          node --check testes/test-regressao-p1.js
          node --check testes/test-multiplayer-aoi.js
          node --check testes/test-carga.js
          node --check testes/test-reconexao-posicao.js
          node --check testes/test-clientes-casa.js
          node --check testes/test-plantio-proprio.js
          node --check testes/test-crescimento.js
          node --check testes/test-login-conta.js
          node --check testes/test-colheita-estoque.js
          node --check testes/test-protecao-entidades.js
          node --check testes/test-audio-mixer.js
          node --check testes/test-movimento-fluido.js
          node --check testes/test-mapa-conexoes.js
          node --check testes/test-spawn-preclick.js
          node --check testes/test-regressao-client-ui.js
          node --check testes/test-persistencia-restart.js
          node --check testes/test-render-config.js
          node check-client-syntax.js
          node --check /tmp/quintal-client-inline.js
      - name: Run isolated regression servers and tests
        env:
          AUTH_SECRET: ci-only-session-secret
          ALLOW_ANONYMOUS: '1'
        run: |
          set -euo pipefail
          pids=()
          cleanup() { for pid in "${pids[@]}"; do kill "$pid" 2>/dev/null || true; done; }
          trap cleanup EXIT
          for port in 8800 8801 8802 8803; do
            rm -f "$RUNNER_TEMP/quintal-$port.db" "$RUNNER_TEMP/quintal-$port.db-shm" "$RUNNER_TEMP/quintal-$port.db-wal"
            PORT="$port" DB_PATH="$RUNNER_TEMP/quintal-$port.db" node servidor-1.js > "$RUNNER_TEMP/quintal-$port.log" 2>&1 &
            pids+=("$!")
          done
          rm -f "$RUNNER_TEMP/quintal-8804.db" "$RUNNER_TEMP/quintal-8804.db-shm" "$RUNNER_TEMP/quintal-8804.db-wal"
          PORT=8804 DB_PATH="$RUNNER_TEMP/quintal-8804.db" CLIENTE_FIRST_S=1 CLIENTE_MIN_S=1 CLIENTE_MAX_S=1 node servidor-1.js > "$RUNNER_TEMP/quintal-8804.log" 2>&1 &
          pids+=("$!")
          rm -f "$RUNNER_TEMP/quintal-8805.db" "$RUNNER_TEMP/quintal-8805.db-shm" "$RUNNER_TEMP/quintal-8805.db-wal"
          PORT=8805 DB_PATH="$RUNNER_TEMP/quintal-8805.db" node servidor-1.js > "$RUNNER_TEMP/quintal-8805.log" 2>&1 &
          pids+=("$!")
          rm -f "$RUNNER_TEMP/quintal-8806.db" "$RUNNER_TEMP/quintal-8806.db-shm" "$RUNNER_TEMP/quintal-8806.db-wal"
          PORT=8806 DB_PATH="$RUNNER_TEMP/quintal-8806.db" CLIENTE_FIRST_S=1 CLIENTE_MIN_S=1 CLIENTE_MAX_S=1 node servidor-1.js > "$RUNNER_TEMP/quintal-8806.log" 2>&1 &
          pids+=("$!")
          rm -f "$RUNNER_TEMP/quintal-8807.db" "$RUNNER_TEMP/quintal-8807.db-shm" "$RUNNER_TEMP/quintal-8807.db-wal"
          PORT=8807 DB_PATH="$RUNNER_TEMP/quintal-8807.db" node servidor-1.js > "$RUNNER_TEMP/quintal-8807.log" 2>&1 &
          pids+=("$!")
          rm -f "$RUNNER_TEMP/quintal-8808.db" "$RUNNER_TEMP/quintal-8808.db-shm" "$RUNNER_TEMP/quintal-8808.db-wal"
          ALLOW_ANONYMOUS=0 PORT=8808 DB_PATH="$RUNNER_TEMP/quintal-8808.db" node servidor-1.js > "$RUNNER_TEMP/quintal-8808.log" 2>&1 &
          pids+=("$!")
          rm -f "$RUNNER_TEMP/quintal-8809.db" "$RUNNER_TEMP/quintal-8809.db-shm" "$RUNNER_TEMP/quintal-8809.db-wal"
          ALLOW_ANONYMOUS=0 PORT=8809 DB_PATH="$RUNNER_TEMP/quintal-8809.db" node servidor-1.js > "$RUNNER_TEMP/quintal-8809.log" 2>&1 &
          pids+=("$!")
          sleep 2
          TEST_HTTP=http://127.0.0.1:8800 npm run test:http
          TEST_WS=ws://127.0.0.1:8800 npm test
          TEST_WS=ws://127.0.0.1:8800 npm run test:p0
          TEST_WS=ws://127.0.0.1:8800 npm run test:p1
          TEST_WS=ws://127.0.0.1:8801 npm run test:aoi
          TEST_WS=ws://127.0.0.1:8809 npm run test:login
          TEST_WS=ws://127.0.0.1:8802 TEST_HTTP=http://127.0.0.1:8802 npm run test:carga
          TEST_WS=ws://127.0.0.1:8803 npm run test:reconexao
          TEST_WS=ws://127.0.0.1:8804 npm run test:clientes
          TEST_WS=ws://127.0.0.1:8805 npm run test:plantio
          TEST_WS=ws://127.0.0.1:8805 npm run test:crescimento
          TEST_WS=ws://127.0.0.1:8806 npm run test:entidades
          TEST_WS=ws://127.0.0.1:8807 npm run test:movimento
          npm run test:mapa
          npm run test:audio
          npm run test:spawn
          npm run test:client-ui
          TEST_PERSIST_PORT=8808 npm run test:persistencia
          npm run test:colheita
          npm run test:render-config
          for port in 8800 8801 8802 8803 8804 8805 8806 8807 8808 8809; do cat "$RUNNER_TEMP/quintal-$port.log"; done

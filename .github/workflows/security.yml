name: Security and regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check syntax
        run: |
          node --check servidor-1.js
          node --check test-seguranca.js
          node --check test-multiplayer-aoi.js
          node --check test-carga.js
          node --check test-reconexao-posicao.js
          node --check test-clientes-casa.js
          node --check test-plantio-proprio.js
          node --check test-protecao-entidades.js
          node check-client-syntax.js
          node --check /tmp/quintal-client-inline.js
      - name: Run isolated regression servers and tests
        env:
          AUTH_SECRET: ci-only-session-secret
        run: |
          set -euo pipefail
          pids=()
          cleanup() { for pid in "${pids[@]}"; do kill "$pid" 2>/dev/null || true; done; }
          trap cleanup EXIT
          for port in 8800 8801 8802 8803; do
            rm -f "$RUNNER_TEMP/quintal-$port.db" "$RUNNER_TEMP/quintal-$port.db-shm" "$RUNNER_TEMP/quintal-$port.db-wal"
            PORT="$port" DB_PATH="$RUNNER_TEMP/quintal-$port.db" node servidor-1.js > "$RUNNER_TEMP/quintal-$port.log" 2>&1 &
            pids+=("$!")
          done
          rm -f "$RUNNER_TEMP/quintal-8804.db" "$RUNNER_TEMP/quintal-8804.db-shm" "$RUNNER_TEMP/quintal-8804.db-wal"
          PORT=8804 DB_PATH="$RUNNER_TEMP/quintal-8804.db" CLIENTE_FIRST_S=1 CLIENTE_MIN_S=1 CLIENTE_MAX_S=1 node servidor-1.js > "$RUNNER_TEMP/quintal-8804.log" 2>&1 &
          pids+=("$!")
          rm -f "$RUNNER_TEMP/quintal-8805.db" "$RUNNER_TEMP/quintal-8805.db-shm" "$RUNNER_TEMP/quintal-8805.db-wal"
          PORT=8805 DB_PATH="$RUNNER_TEMP/quintal-8805.db" node servidor-1.js > "$RUNNER_TEMP/quintal-8805.log" 2>&1 &
          pids+=("$!")
          rm -f "$RUNNER_TEMP/quintal-8806.db" "$RUNNER_TEMP/quintal-8806.db-shm" "$RUNNER_TEMP/quintal-8806.db-wal"
          PORT=8806 DB_PATH="$RUNNER_TEMP/quintal-8806.db" CLIENTE_FIRST_S=1 CLIENTE_MIN_S=1 CLIENTE_MAX_S=1 node servidor-1.js > "$RUNNER_TEMP/quintal-8806.log" 2>&1 &
          pids+=("$!")
          sleep 2
          TEST_WS=ws://127.0.0.1:8800 npm test
          TEST_WS=ws://127.0.0.1:8801 npm run test:aoi
          TEST_WS=ws://127.0.0.1:8802 TEST_HTTP=http://127.0.0.1:8802 npm run test:carga
          TEST_WS=ws://127.0.0.1:8803 npm run test:reconexao
          TEST_WS=ws://127.0.0.1:8804 npm run test:clientes
          TEST_WS=ws://127.0.0.1:8805 npm run test:plantio
          TEST_WS=ws://127.0.0.1:8806 npm run test:entidades
          for port in 8800 8801 8802 8803 8804 8805 8806; do cat "$RUNNER_TEMP/quintal-$port.log"; done

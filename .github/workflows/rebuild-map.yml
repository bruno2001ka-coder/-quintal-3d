name: Rebuild map integration

on:
  push:
    branches:
      - rebuild/map-integration-2026-08-29

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconcile map geometry with authoritative server
        shell: python
        run: |
          from pathlib import Path
          import re

          server_path = Path('servidor-1.js')
          s = server_path.read_text(encoding='utf-8')

          # The current visual map uses compact 8x7 m lots. Keep one
          # authoritative lot collision footprint and a spawn safely beyond
          # the front gate. Do not touch weapons, economy or gameplay systems.
          spawn_pattern = re.compile(r"function spawnNaPortaDoLote\(lote\) \{.*?\n\}", re.S)
          spawn_repl = """function spawnNaPortaDoLote(lote) {
  // Spawn on the sidewalk immediately outside the front gate.
  // This keeps the player outside the construction on the compact 8x7m map.
  return { x: lote.x, y: 12, z: lote.z + LOTE_D / 2 + 1.25, ry: 0 };
}"""
          s, n_spawn = spawn_pattern.subn(spawn_repl, s, count=1)
          if n_spawn != 1:
              raise SystemExit('ERRO: spawnNaPortaDoLote não encontrado')

          coll_pattern = re.compile(r"const COL_LOTE_REL = \[.*?\n\];\nconst IDX_PORTAO = 5;", re.S)
          coll_repl = """const COL_LOTE_REL = [
  [-4.0, 4.0, -3.625, -3.375], // fundo
  [-4.0, -3.75, -3.5, 3.5],     // lateral esquerda
  [3.75, 4.0, -3.5, 3.5],       // lateral direita
  [-4.0, -1.6, 3.375, 3.625],   // frente esquerda
  [1.6, 4.0, 3.375, 3.625],     // frente direita
  [-1.6, 1.6, 3.375, 3.625]     // portão central
];
const IDX_PORTAO = 5;"""
          s, n_coll = coll_pattern.subn(coll_repl, s, count=1)
          if n_coll != 1:
              raise SystemExit('ERRO: COL_LOTE_REL não encontrado')

          server_path.write_text(s, encoding='utf-8')

          Path('MAP_REBUILD_STATUS.md').write_text("""# Quintal 3D — reconstrução da integração do mapa

Branch de reconstrução: `rebuild/map-integration-2026-08-29`

Objetivo: tratar o mapa visual atual como fonte de verdade e alinhar a camada authoritative sem alterar armas, economia, inventário ou multiplayer.

## Primeira correção

- lotes authoritative: 8 × 7 m;
- colisores relativos do lote: uma única definição compatível com o lote compacto;
- spawn do proprietário: 1,25 m além do limite frontal do lote;
- personagem permanece responsabilidade do cliente; servidor fornece apenas posição authoritative.

## Próxima etapa

Validar a posição de cada lote, portão e construção contra o mapa visual atual antes de levar qualquer alteração desta branch para `main`.
""", encoding='utf-8')

      - name: Validate
        shell: bash
        run: |
          node --check servidor-1.js
          node testes/test-spawn-preclick.js
          git diff --check

      - name: Commit reconciliation
        shell: bash
        run: |
          if git diff --quiet -- servidor-1.js MAP_REBUILD_STATUS.md; then
            echo "Nenhuma alteração pendente."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add servidor-1.js MAP_REBUILD_STATUS.md
          git commit -m "fix: rebuild compact map collision and spawn baseline"
          git push origin HEAD:rebuild/map-integration-2026-08-29

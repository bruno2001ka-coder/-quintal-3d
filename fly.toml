app = "quintal-3d-bruno"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DB_PATH = "/data/quintal.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 40
    hard_limit = 64

  [http_service.http_options]
    idle_timeout = 600

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"
    protocol = "http"

[mounts]
  source = "quintal_data"
  destination = "/data"
  initial_size = "1GB"
  snapshot_retention = 7
  scheduled_snapshots = true

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  cpus = 2
  cpu_kind = "shared"
  processes = ["app"]

[[restart]]
  policy = "on-failure"
  retries = 10
  processes = ["app"]

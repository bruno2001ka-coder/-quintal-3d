services:
  - type: web
    name: quintal-3d
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quintal-3d-postgres
          property: connectionString

databases:
  - name: quintal-3d-postgres
    databaseName: quintal3d
    plan: free
